image:
  repository: modest
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

replicaCount: 2

nameOverride: ""
fullnameOverride: ""

service:
  # EST is served over TLS and is the only externally reachable port.
  est:
    type: ClusterIP
    port: 8443
    # Only meaningful when type is LoadBalancer, and only honoured by cloud providers that support
    # requesting a specific address (most do; some ignore it). Left empty, the provider assigns one.
    loadBalancerIP: ""
  # Health probes and any internal scraping. Never expose this outside the cluster:
  # it is plain HTTP by design so probes need no TLS handshake.
  ops:
    type: ClusterIP
    port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# Applied to the pod. The image already runs as non-root; these make it explicit and
# enforced by the API server rather than trusted from the image.
#
# runAsUser/runAsGroup/fsGroup are all 1654: the uid:gid of the "app" user baked into the .NET
# chiselled image by docker/Dockerfile's `USER $APP_UID`. Pinning runAsUser/runAsGroup here isn't
# strictly required for the image to work (it already runs as that user by default), but it makes
# the identity explicit and enforced by the API server rather than trusted from the image, and it
# keeps this value next to fsGroup, which is required. All three must move together if the base
# image ever changes.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1654
  runAsGroup: 1654
  seccompProfile:
    type: RuntimeDefault
  # Secret volumes are mounted owned by root with this as the group; without it, the container's
  # non-root process cannot read the TLS/CA secrets at all, and the pod crash-loops on startup.
  fsGroup: 1654

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

logging:
  defaultLevel: Information
  aspNetCoreLevel: Warning

tls:
  # Secret holding the server's TLS identity. Create it yourself:
  #   kubectl create secret generic modest-tls \
  #     --from-file=tls.pfx=./tls.pfx --from-file=tls.pass=./tls.pass
  # The chart never templates secret values into rendered manifests.
  existingSecret: modest-tls
  pfxKey: tls.pfx
  # Set to "" for a PFX with no password (Modest's loader accepts one — see ModestHost.cs's
  # LoadServerCertificate). Doing so omits Kestrel:Est:CertificatePasswordFile from the rendered
  # config entirely, so the Secret above then only needs the tls.pfx key.
  passwordKey: tls.pass

est:
  maxRequestBodyBytes: 65536

authentication:
  allowClientCertificate: true
  allowHttpBasic: true
  basicRealm: modest

  # Optional PEM bundle of trust anchors for validating EST client certificates. This is a
  # different trust domain from the issuing CA: clients often authenticate with certificates
  # from a pre-existing PKI.
  clientCertificateTrustStore:
    existingSecret: ""     # e.g. modest-client-trust
    key: clients.pem

  # PBKDF2 verifiers, never plaintext. Generate with:
  #   modest hash-password --username device --password '<pw>'
  basicCredentials: []
  # - username: device
  #   passwordHash: "..."
  #   salt: "..."
  #   iterations: 210000

issuance:
  # InternalCa | HttpDelegate
  mode: InternalCa

  reenrollment:
    # Require the client to authenticate with the certificate it is renewing, and to request
    # exactly the same subject and SANs. Leaving this off turns re-enrollment into an
    # impersonation endpoint for any holder of any valid certificate.
    requireMatchingIdentity: true

  internalCa:
    # Secret holding the CA keypair. Create it yourself:
    #   kubectl create secret generic modest-ca \
    #     --from-file=ca.pfx=./ca.pfx --from-file=ca.pfx.pass=./ca.pfx.pass
    existingSecret: modest-ca
    pfxKey: ca.pfx
    passwordKey: ca.pfx.pass

    signatureAlgorithm: SHA256
    validityPeriod: "90.00:00:00"
    backdateBy: "00:05:00"
    minimumRsaKeySizeBits: 2048
    allowRsa: true
    allowEllipticCurve: true
    allowedEllipticCurves: ["nistP256", "nistP384", "nistP521"]
    enhancedKeyUsageOids: ["1.3.6.1.5.5.7.3.2"]   # clientAuth
    keyUsages: ["DigitalSignature", "KeyEncipherment"]
    copySubjectAlternativeNames: true
    requireSubjectOrSan: true

  httpDelegate:
    baseAddress: ""
    issuePath: /api/v1/issue
    timeoutSeconds: 30
    maxRetryAttempts: 3
    maxCsrSizeBytes: 16384

    basicAuthUsername: ""
    # Secret holding the upstream Basic auth password.
    #   kubectl create secret generic modest-upstream --from-file=password=./password
    credentialsSecret:
      existingSecret: ""
      passwordKey: password

    # PEM chain published from /cacerts. Statically configured because /cacerts must answer a
    # client that has never enrolled — the bootstrap case — which a cache of past issuance
    # responses cannot do.
    caChain:
      existingConfigMap: ""
      key: chain.pem

    # Optional PEM bundle of extra trust anchors for validating the upstream issuance API's TLS
    # certificate (e.g. a private/internal CA). Modest has no dedicated trust-store setting for
    # this — it's wired through the SSL_CERT_FILE environment variable, which .NET's OpenSSL-backed
    # TLS stack on Linux honours directly and *adds* to the image's normal trust store rather than
    # replacing it (verified against both a private CA and a real public site). A ConfigMap, not a
    # Secret, because it only holds public certificates — same reasoning as caChain above. Leave
    # existingConfigMap empty if the upstream's certificate already chains to a publicly trusted CA.
    upstreamTrustStore:
      existingConfigMap: ""    # e.g. modest-upstream-trust
      key: ca.pem

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
# Merged into the pod template's labels alongside the chart's own selector labels (rendered after
# them, so a colliding key wins here) — additive, not a replacement. Do not set
# app.kubernetes.io/name or app.kubernetes.io/instance here: the Deployment's spec.selector is fixed
# to the chart's own values, and overriding either on the pod template would make the ReplicaSet
# unable to adopt its own pods. Useful for things like a service mesh's injection label or an
# internal cost-allocation tag.
podLabels: {}
